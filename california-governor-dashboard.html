:root{
  --bg-base:#f8f9fc; --bg-surface:#eef0f7; --bg-elevated:#ffffff;
  --text-primary:#1a1a1a; --text-secondary:#4a4a4a; --text-muted:#737373;
  --accent-deep:#351c71; --accent:#7c3aed; --focus:#c9b6ff;
  --stroke:#e5e5e5; --menu-border:#dcdce7; --secondary-border:#d2d2d7;
  --card-shadow:0 18px 44px rgba(23,25,38,.08);
  --menu-shadow:0 22px 48px rgba(53,28,113,.16);
  --font-head:"TT Norms Pro","Avenir Next",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-body:"Avenir Next",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --becerra-strong:#7c3aed; --steyer-strong:#2980b9; --porter-strong:#16a085;
  --mahan-strong:#27ae60; --hilton-strong:#c0392b; --bianco-strong:#e67e22;
}
*,*::before,*::after{box-sizing:border-box;}
html{font-size:16px;}
body{margin:0;background:var(--bg-base);color:var(--text-primary);font-family:var(--font-body);font-weight:400;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}

/* candidate color classes (popup + leader card) */
.becerra{color:var(--becerra-strong);} .steyer{color:var(--steyer-strong);}
.porter{color:var(--porter-strong);} .mahan{color:var(--mahan-strong);}
.hilton{color:var(--hilton-strong);} .bianco{color:var(--bianco-strong);}
.others{color:#7f8c8d;}

/* ---- layout ---- */
.vh-root{padding:28px 20px 56px;min-height:100%;}
.vh-wrap{max-width:1480px;margin:0 auto;}
.page-header{margin-bottom:22px;}
.page-header h1{font-family:var(--font-head);font-weight:500;font-size:2rem;line-height:1.08;letter-spacing:-.01em;color:var(--text-primary);margin:0 0 .5rem;}
.page-header p{font-size:.9375rem;color:var(--text-secondary);line-height:1.5;margin:0;max-width:880px;}
.vh-grid{display:grid;grid-template-columns:1fr 400px;gap:20px;align-items:start;}
@media(max-width:1100px){.vh-grid{grid-template-columns:1fr;}}
.right-col{position:sticky;top:22px;height:var(--sidebar-match-height,calc(100vh - 44px));max-height:var(--sidebar-match-height,calc(100vh - 44px));overflow-y:auto;padding-right:8px;scrollbar-width:none;-ms-overflow-style:none;}
.right-col::-webkit-scrollbar{display:none;}
.right-col::after{content:"";display:block;height:18px;pointer-events:none;position:sticky;z-index:3;bottom:0;margin-top:-18px;background:linear-gradient(to top,var(--bg-base),rgba(248,249,252,0));}
.right-col .vh-card{box-shadow:none;}
@media(max-width:1200px){.right-col{position:static;height:auto;max-height:none;overflow:visible;padding-right:0;}.right-col::after{display:none;}.reset-btn{position:static;}}

/* ---- results banner ---- */
.results-banner{margin-bottom:16px;}
.candidate-summary{display:grid;grid-template-columns:minmax(0,1fr) 204px;gap:16px;}
@media(max-width:760px){.candidate-summary{grid-template-columns:1fr;}}
.cand-bars{background:var(--bg-elevated);border:1px solid var(--menu-border);border-radius:16px;box-shadow:var(--card-shadow);padding:6px 20px;}
.cand-row{display:grid;grid-template-columns:250px 1fr 66px;gap:16px;align-items:center;padding:12px 0;}
.cand-row + .cand-row{border-top:1px solid var(--stroke);}
.cutoff-row + .cand-row{border-top:none;}
.cand-name-block{display:flex;align-items:center;gap:11px;min-width:0;}
.cand-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1.5px solid #fff;box-shadow:0 0 0 1px var(--stroke);flex-shrink:0;}
.cand-text{min-width:0;}
.cand-name{font-family:var(--font-head);font-weight:600;font-size:14px;display:flex;align-items:center;min-width:0;}
.cand-name-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.party-tag{flex-shrink:0;margin-left:6px;font-size:10px;font-weight:600;background:var(--bg-surface);color:var(--accent-deep);border-radius:999px;padding:1px 7px;line-height:1.5;}
.advances-badge{flex-shrink:0;margin-left:7px;font-size:8.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:#fff;border-radius:999px;padding:2px 7px;}
.cand-sub{font-size:11px;color:var(--text-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{height:20px;background:var(--bg-surface);border-radius:999px;overflow:hidden;}
.bar-fill{height:100%;border-radius:999px;transition:width .3s ease;}
.cand-pct{text-align:right;font-family:var(--font-head);font-weight:600;font-size:19px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
.cutoff-row{display:flex;align-items:center;gap:10px;margin:1px 0;color:var(--text-muted);font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;}
.cutoff-row::before,.cutoff-row::after{content:"";flex:1;height:0;border-top:1px dashed var(--menu-border);}

/* ---- leader card ---- */
.margin-summary{background:var(--bg-elevated);border:1px solid var(--menu-border);border-radius:16px;box-shadow:var(--card-shadow);display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:22px 16px;gap:12px;}
.ms-head{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);}
.ms-cand{display:flex;flex-direction:column;align-items:center;gap:7px;}
.ms-avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid #fff;box-shadow:0 0 0 1px var(--stroke);}
.ms-name{font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;line-height:1.15;}
.ms-pct{font-family:var(--font-head);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;}
.ms-rule{position:relative;width:100%;display:flex;align-items:center;justify-content:center;}
.ms-rule::before{content:"";position:absolute;top:50%;left:0;right:0;border-top:1px dashed var(--menu-border);}
.ms-rule span{position:relative;background:var(--bg-elevated);padding:0 9px;font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);}

/* ---- map ---- */
.map-card{background:var(--bg-elevated);border-radius:16px;box-shadow:var(--card-shadow);padding:14px 16px 12px;}
.map-caption{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin:0 0 8px 2px;}
.tx-map{width:100%;height:560px;border-radius:12px;overflow:hidden;}
.map-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:12px;padding-top:12px;border-top:1px solid var(--stroke);}
.legend-item{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-secondary);}
.legend-swatch{width:11px;height:11px;border-radius:3px;flex-shrink:0;}
.legend-name{font-weight:600;}
.legend-count{font-variant-numeric:tabular-nums;color:var(--text-muted);font-weight:600;background:var(--bg-surface);border-radius:999px;padding:0 7px;font-size:10.5px;}

/* MapLibre popup -> tooltip spec */
.tx-popup .maplibregl-popup-content{background:var(--bg-elevated);border:1px solid var(--menu-border);border-radius:10px;box-shadow:var(--menu-shadow);padding:.65rem .85rem;font-family:var(--font-body);}
.tx-popup .maplibregl-popup-tip{display:none;}
.tx-popup-title{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:6px;padding-bottom:6px;border-bottom:1px solid var(--stroke);}
.tx-popup-head{display:flex;justify-content:space-between;font-size:9px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px;}
.tx-popup-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--text-secondary);padding:2.5px 0;font-variant-numeric:tabular-nums;}
.tx-popup-name{font-weight:600;}
.tx-popup-row b{font-weight:600;}
.tx-popup-margin{margin-top:5px;padding-top:6px;border-top:1px solid var(--stroke);font-size:10.5px;color:var(--text-muted);}
.tx-popup-margin span{letter-spacing:.06em;}

/* ---- cards / controls ---- */
.vh-card{background:var(--bg-elevated);border:1px solid var(--menu-border);border-radius:16px;box-shadow:var(--card-shadow);overflow:hidden;margin-bottom:14px;}
.card-header{width:100%;display:flex;justify-content:space-between;align-items:center;padding:15px 18px;cursor:pointer;background:transparent;border:none;text-align:left;font-family:inherit;}
.card-header:hover{background:#fafbfd;}
.card-title-text{font-family:var(--font-head);font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--text-primary);}
.card-header-right{display:flex;align-items:center;}
.chev{color:var(--text-muted);transition:transform .2s ease;display:flex;}
.chev.open{transform:rotate(180deg);}
.card-body{padding:14px 18px 16px;border-top:1px solid var(--stroke);}
.sub-section-title{font-family:var(--font-head);font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:3px;}
.sub-section-sub{font-size:11px;color:var(--text-muted);line-height:1.45;margin-bottom:10px;}
.bracket-group{margin-top:14px;}
.bracket-group:first-of-type{margin-top:0;}
.bracket-group-head{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px;padding-bottom:5px;border-bottom:1px solid var(--stroke);}
.slider-row{padding:9px 0;border-top:1px solid var(--stroke);}
.slider-row:first-of-type{border-top:none;padding-top:4px;}
.slider-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:12px;}
.slider-lbl{font-size:12.5px;font-weight:600;color:var(--text-primary);}
.slider-hint{display:block;font-size:11px;color:var(--text-muted);margin-top:2px;}
.slider-val{font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;}
.vh-slider{-webkit-appearance:none;appearance:none;width:100%;background:transparent;cursor:pointer;margin:4px 0;--thumb-color:var(--accent);}
.vh-slider::-webkit-slider-runnable-track{height:5px;background:var(--bg-surface);border-radius:999px;}
.vh-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:15px;height:15px;border-radius:50%;background:var(--thumb-color);margin-top:-5px;border:2.5px solid #fff;box-shadow:0 1px 4px rgba(53,28,113,.25);transition:transform .14s ease;}
.vh-slider::-webkit-slider-thumb:hover{transform:scale(1.15);}
.vh-slider::-moz-range-track{height:5px;background:var(--bg-surface);border-radius:999px;}
.vh-slider::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--thumb-color);border:2.5px solid #fff;}
.reset-btn{position:sticky;bottom:0;z-index:4;width:100%;min-height:48px;margin-top:6px;background:var(--bg-elevated);border:1px solid var(--secondary-border);border-radius:8px;font-family:var(--font-body);font-size:14px;font-weight:600;color:var(--accent-deep);cursor:pointer;transition:background-color 160ms ease,border-color 160ms ease,color 160ms ease;}
.reset-btn:hover{background:var(--bg-surface);}
.reset-btn:active{background:#e4e6ef;}
.error-pane{padding:20px;margin:20px;font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap;color:#dc2626;background:#fef2f2;border:1px solid #fecaca;border-radius:12px;}

/* MapLibre nav control on-brand */
.maplibregl-ctrl-group{border-radius:10px!important;box-shadow:var(--card-shadow)!important;overflow:hidden;}
@media(max-width:760px){.vh-root{padding:20px 14px 48px;}.cand-row{grid-template-columns:1fr auto;gap:7px 12px;}.cand-name-block{grid-column:1;grid-row:1;}.cand-pct{grid-column:2;grid-row:1;font-size:17px;}.bar-track{grid-column:1 / -1;grid-row:2;}.tx-map{height:440px;}.page-header h1{font-size:1.875rem;}}

/* ──────────── CANDIDATES ──────────── */
const CANDIDATES = [
  { id: 'becerra', cls: 'becerra', name: 'Xavier Becerra', party: 'D', sub: 'Former HHS Secretary',     color: 'var(--becerra-strong)' },
  { id: 'steyer',  cls: 'steyer',  name: 'Tom Steyer',     party: 'D', sub: 'Investor / activist',       color: 'var(--steyer-strong)' },
  { id: 'porter',  cls: 'porter',  name: 'Katie Porter',   party: 'D', sub: 'Former U.S. Representative', color: 'var(--porter-strong)' },

  { id: 'hilton',  cls: 'hilton',  name: 'Steve Hilton',   party: 'R', sub: 'Trump-endorsed',             color: 'var(--hilton-strong)' },
  { id: 'bianco',  cls: 'bianco',  name: 'Chad Bianco',    party: 'R', sub: 'Riverside County Sheriff',   color: 'var(--bianco-strong)' }
];
const HEX = {
  becerra: '#7c3aed', steyer: '#2980b9', porter: '#16a085', mahan: '#27ae60',
  hilton: '#c0392b', bianco: '#e67e22', others: '#7f8c8d'
};
const CAND_BY_ID = Object.fromEntries(CANDIDATES.map(c => [c.id, c]));
const NAMED = CANDIDATES.filter(c => c.id !== 'others');
const ALL_IDS = CANDIDATES.map(c => c.id);
const NAMED_IDS = CANDIDATES.filter(c => c.id !== 'others').map(c => c.id);
const DEM_IDS = ['becerra', 'steyer', 'porter', 'mahan'];
const GOP_IDS = ['hilton', 'bianco'];

/* ──────────── DEMOGRAPHICS (Citizen Voting-Age Population by race/ethnicity) ────────────
   Five race groups built from each county's Citizen Voting-Age Population.
   Each group has a candidate-support row that sums to 1; a county's candidate
   totals are the CVAP-weighted sum of those rows, then anchored to the county's
   2024 lean for correct geography. No turnout or electorate assumptions. */
const RACES = [
  { id: 'hisp',  label: 'Hispanic / Latino' },
  { id: 'white', label: 'White' },
  { id: 'black', label: 'Black' },
  { id: 'asian', label: 'Asian' },
  { id: 'other', label: 'Other / multiracial' }
];

// Candidate support within each race/ethnicity group. Each group sums to 100%.
const SUPPORT_DEFAULT = {
  hisp:  { becerra: 0.2403, steyer: 0.1902, porter: 0.0763, mahan: 0.1139, hilton: 0.2528, bianco: 0.1264 },
  white: { becerra: 0.2298, steyer: 0.1958, porter: 0.1606, mahan: 0.0692, hilton: 0.1958, bianco: 0.1489 },
  black: { becerra: 0.2368, steyer: 0.2895, porter: 0.1842, mahan: 0.1842, hilton: 0.1053, bianco: 0.0000 },
  asian: { becerra: 0.2026, steyer: 0.2967, porter: 0.0941, mahan: 0.1244, hilton: 0.1882, bianco: 0.0941 },
  other: { becerra: 0.1928, steyer: 0.1446, porter: 0.0361, mahan: 0.0602, hilton: 0.3133, bianco: 0.2530 }
};

/* ──────────── MODEL (pure demographics + 2024 anchor) ────────────
   Each county's eligible population by race is fixed (Citizen Voting-Age
   Population). raw_support_cand = Σ_race CVAP_race × support[race][cand].
   A partisan anchor then tilts the Dem-block and GOP-block masses toward the
   county's own 2024 two-party lean at the default support, shifting by how far
   the current Support levers move that share — so demographically similar
   counties that vote very differently (white-liberal Marin vs white-conservative
   Shasta) are placed correctly while the Support levers still move the map. */

// GOP share each county's demographics imply at the DEFAULT support.
function defaultCountyGopShare(county) {
  let dem = 0, gop = 0;
  for (const race of RACES) {
    const e = county.cvapTotal * (county.race[race.id] / 100);
    for (const id of DEM_IDS) dem += e * SUPPORT_DEFAULT[race.id][id];
    for (const id of GOP_IDS) gop += e * SUPPORT_DEFAULT[race.id][id];
  }
  const non = dem + gop;
  return non > 0 ? gop / non : 0.3;
}

function countyResult(county, support) {
  const pop = {};
  for (const race of RACES) pop[race.id] = county.cvapTotal * (county.race[race.id] / 100);
  const raw = {};
  for (const id of ALL_IDS) { let v = 0; for (const race of RACES) v += pop[race.id] * support[race.id][id]; raw[id] = v; }
  const gopTarget = Math.max(0.05, Math.min(0.80, 0.33 * (county.trump2024 / 39.3)));
  const demMass = DEM_IDS.reduce((s, id) => s + raw[id], 0);
  const gopMass = GOP_IDS.reduce((s, id) => s + raw[id], 0);
  const nonOther = demMass + gopMass;
  const def = defaultCountyGopShare(county);
  const curGopShare = nonOther > 0 ? gopMass / nonOther : def;
  const demoDelta = curGopShare - def;
  const adj = { ...raw };
  if (nonOther > 0) {
    const gShare = Math.max(0.02, Math.min(0.95, gopTarget + demoDelta));
    const gTot = nonOther * gShare, dTot = nonOther * (1 - gShare);
    if (gopMass > 0) GOP_IDS.forEach(id => { adj[id] = raw[id] * gTot / gopMass; });
    if (demMass > 0) DEM_IDS.forEach(id => { adj[id] = raw[id] * dTot / demMass; });
  }
  const total = ALL_IDS.reduce((s, id) => s + adj[id], 0);
  return { votes: adj, total };
}

function project(counties, support) {
  const totals = Object.fromEntries(ALL_IDS.map(id => [id, 0]));
  let grand = 0;
  const perCounty = new Map();
  for (const county of counties) {
    const { votes, total } = countyResult(county, support);
    for (const id of ALL_IDS) totals[id] += votes[id];
    grand += total;
    const ranked = ALL_IDS.map(id => ({ id, v: votes[id] })).sort((a, b) => b.v - a.v);
    perCounty.set(county.name, {
      total,
      leadId: ranked[0].id,
      pct: total > 0 ? Object.fromEntries(ALL_IDS.map(id => [id, votes[id] / total * 100])) : {},
      margin: total > 0 ? (ranked[0].v - ranked[1].v) / total * 100 : 0
    });
  }
  const pct = Object.fromEntries(ALL_IDS.map(id => [id, grand > 0 ? totals[id] / grand * 100 : 0]));
  const ranked = ALL_IDS.map(id => ({ id, pct: pct[id] })).sort((a, b) => b.pct - a.pct);
  return { pct, grand, ranked, perCounty };
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const headers = lines[0].split(",");
  const rows = new Array(lines.length - 1);
  for (let i = 1; i < lines.length; i++) {
    const vals = lines[i].split(",");
    const obj = {};
    for (let j = 0; j < headers.length; j++) obj[headers[j]] = vals[j];
    rows[i - 1] = obj;
  }
  return rows;
}

function buildCounties(rows) {
  return rows.map(r => ({
    name: r.county,
    trump2024: +r.trump_2024_pct || 0,
    cvapTotal: +r.cvap_total || 0,
    race: {
      hisp: +r.hisp_pct || 0,
      white: +r.white_pct || 0,
      black: +r.black_pct || 0,
      asian: +r.asian_pct || 0,
      other: +r.other_pct || 0
    }
  }));
}

/* ──────────── MAP ──────────── */
function buildLeaderFillExpression() {
  const match = ["match", ["coalesce", ["feature-state", "lead_id"], "none"]];
  for (const c of CANDIDATES) match.push(c.id, HEX[c.id]);
  match.push("#d4d4d8");
  return match;
}

function CaliforniaMap({ geojson, countyResults }) {
  const containerRef = useRef(null);
  const mapRef = useRef(null);
  const resultsRef = useRef(null);
  const [mapReady, setMapReady] = useState(false);

  useEffect(() => {
    const container = containerRef.current;
    if (!container || mapRef.current || !geojson) return;
    if (typeof maplibregl === "undefined") { console.error("MapLibre GL JS not loaded"); return; }
    let cancelled = false;

    Promise.all([
      fetch(ARCGIS_HG_BASE_STYLE).then(r => r.json()),
      fetch(ARCGIS_HG_DETAIL_STYLE).then(r => r.json()),
      fetch(ARCGIS_HG_LABEL_STYLE).then(r => r.json())
    ]).then(([base, detail, label]) => {
      if (cancelled) return;
      const fillExpr = buildLeaderFillExpression();
      const style = {
        version: 8, glyphs: ARCGIS_GLYPHS_URL,
        sources: {
          esri: { type: "vector", tiles: [ARCGIS_TILE_URL], minzoom: 0, maxzoom: 16 },
          counties: { type: "geojson", data: geojson }
        },
        layers: [
          ...base.layers,
          { id: "county-fill", type: "fill", source: "counties", paint: { "fill-color": fillExpr, "fill-opacity": 0.85 } },
          { id: "county-outline", type: "line", source: "counties", paint: { "line-color": "#1a1a1a", "line-width": 0.8 } },
          ...detail.layers,
          ...label.layers
        ]
      };
      const map = new maplibregl.Map({
        container, style, center: [-119.4, 37.2], zoom: 4.6, minZoom: 3.5, maxZoom: 12, attributionControl: false
      });
      map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
      map.addControl(new maplibregl.AttributionControl({ compact: true, customAttribution: "Esri · TomTom · Garmin · FAO · NOAA · USGS · OpenStreetMap" }));

      const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 8, maxWidth: "260px", className: "tx-popup" });
      const showTip = e => {
        const ft = e.features?.[0]; if (!ft) return;
        const name = ft.properties?.name || "?";
        const res = resultsRef.current?.get(name);
        const lines = [`<div class="tx-popup-title">${name} County</div>`];
        if (res && res.total > 0) {
          lines.push(`<div class="tx-popup-head"><span>CANDIDATE</span><span>EST. SHARE</span></div>`);
          ALL_IDS.map(id => ({ c: CAND_BY_ID[id], pct: res.pct[id] || 0 }))
            .sort((a, b) => b.pct - a.pct).slice(0, 5)
            .forEach(row => lines.push(
              `<div class="tx-popup-row"><span class="tx-popup-name ${row.c.cls}">${row.c.name}</span><b class="${row.c.cls}">${row.pct.toFixed(1)}%</b></div>`));
          const lead = CAND_BY_ID[res.leadId];
          lines.push(`<div class="tx-popup-row tx-popup-margin"><span>LEADS:</span><b class="${lead.cls}">${lead.name.split(' ').slice(-1)[0]} +${res.margin.toFixed(1)}</b></div>`);
        } else lines.push(`<div class="tx-popup-row"><span>No data</span></div>`);
        popup.setLngLat(e.lngLat).setHTML(lines.join("")).addTo(map);
      };
      const hideTip = () => popup.remove();
      map.on("mousemove", "county-fill", showTip);
      map.on("mouseleave", "county-fill", hideTip);
      map.on("mouseenter", "county-fill", () => map.getCanvas().style.cursor = "pointer");
      map.on("mouseleave", "county-fill", () => map.getCanvas().style.cursor = "");
      map.on("load", () => setMapReady(true));
      map.on("error", ev => console.error("Map error:", ev?.error || ev));
      mapRef.current = map;
    }).catch(err => console.error("Map init failed:", err));

    return () => { cancelled = true; if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; setMapReady(false); } };
  }, [geojson]);

  useEffect(() => {
    resultsRef.current = countyResults;
    const map = mapRef.current;
    if (!map || !countyResults || !mapReady || !geojson) return;
    for (const ft of geojson.features) {
      const res = countyResults.get(ft.properties?.name);
      if (res) map.setFeatureState({ source: "counties", id: ft.id }, { lead_id: res.leadId });
    }
  }, [countyResults, mapReady, geojson]);

  return h("div", { ref: containerRef, className: "tx-map" });
}

/* ──────────── UI PRIMITIVES (uploaded CSS classes) ──────────── */
function SliderRow({ label, hint, value, onChange, max = 100, step = 0.5, suffix = '%', color = 'var(--cornyn-border)' }) {
  const v = Number(value);
  return h("div", { className: "slider-row" },
    h("div", { className: "slider-head" },
      h("div", null,
        h("span", { className: "slider-lbl" }, label),
        hint && h("span", { className: "slider-hint" }, hint)),
      h("span", { className: "slider-val", style: { color } }, `${v.toFixed(step >= 1 ? 0 : 1)}${suffix}`)),
    h("input", { type: "range", className: "vh-slider", min: 0, max, step, value, onChange: e => onChange(+e.target.value), style: { '--thumb-color': color } }));
}

function SubSection({ title, sub, children }) {
  return h("div", { className: "sub-section" },
    h("div", { className: "sub-section-title" }, title),
    sub && h("div", { className: "sub-section-sub" }, sub),
    children);
}

function CollapsibleCard({ title, defaultOpen, children }) {
  const [open, setOpen] = useState(defaultOpen);
  return h("div", { className: "vh-card collapsible" },
    h("button", { className: "card-header", onClick: () => setOpen(!open) },
      h("span", { className: "card-title-text" }, title),
      h("div", { className: "card-header-right" },
        h("span", { className: `chev ${open ? 'open' : ''}` },
          h("svg", { width: "12", height: "12", viewBox: "0 0 12 12" },
            h("path", { d: "M3 4.5L6 7.5L9 4.5", stroke: "currentColor", strokeWidth: "1.5", fill: "none", strokeLinecap: "round", strokeLinejoin: "round" }))))),
    open && h("div", { className: "card-body" }, children));
}

function candPhoto(id) {
  if (typeof window !== "undefined" && window.__CA_PHOTOS__ && window.__CA_PHOTOS__[id]) return window.__CA_PHOTOS__[id];
  return assetUrl(`photos/${id}.jpg`);
}

function CandRow({ cand, pct, qualifies }) {
  const avatar = h("img", { className: "cand-avatar", src: candPhoto(cand.id), alt: cand.name, loading: "lazy",
    onError: e => { e.target.style.visibility = 'hidden'; } });
  return h("div", { className: "cand-row" },
    h("div", { className: "cand-name-block" },
      avatar,
      h("div", { className: "cand-text" },
        h("div", { className: "cand-name", style: { color: cand.color } },
          h("span", { className: "cand-name-text" }, cand.name),
          h("span", { className: "party-tag" }, cand.party),
          qualifies && h("span", { className: "advances-badge" }, "Advances")),
        h("div", { className: "cand-sub" }, cand.sub))),
    h("div", { className: "bar-track" }, h("div", { className: "bar-fill", style: { width: `${Math.min(100, pct)}%`, background: cand.color } })),
    h("div", { className: "cand-pct", style: { color: cand.color } }, `${pct.toFixed(1)}%`));
}

/* ──────────── ROOT ──────────── */
function CAGovernorForecast() {
  const leftColRef = useRef(null);
  const rightColRef = useRef(null);

  const [support, setSupport] = useState(SUPPORT_DEFAULT);
  const [mapData, setMapData] = useState(null);

  useEffect(() => {
    let cancelled = false;
    const ingest = (gj, csvText) => {
      if (cancelled) return;
      const counties = buildCounties(parseCSV(csvText));
      for (let i = 0; i < gj.features.length; i++) gj.features[i].id = i;
      setMapData({ geojson: gj, counties });
    };
    if (typeof window !== "undefined" && window.__CA_GEOJSON__ && window.__CA_CSV__) {
      ingest(window.__CA_GEOJSON__, window.__CA_CSV__);
      return () => { cancelled = true; };
    }
    Promise.all([
      fetch(assetUrl("california-counties.geojson")).then(r => r.json()),
      fetch(assetUrl("ca_governor_counties.csv")).then(r => r.text())
    ]).then(([gj, csvText]) => ingest(gj, csvText)).catch(err => console.error("Data load failed:", err));
    return () => { cancelled = true; };
  }, []);

  // support: edit one candidate within a race; the other six renormalize to 1.
  const setSup = (raceId, candId, vPct) => {
    const v = Math.max(0, Math.min(100, vPct)) / 100;
    setSupport(prev => {
      const row = prev[raceId];
      const others = ALL_IDS.filter(id => id !== candId);
      const otherSum = others.reduce((s, id) => s + row[id], 0);
      const remainder = Math.max(0, 1 - v);
      const next = { ...row, [candId]: v };
      if (otherSum > 0) others.forEach(id => { next[id] = row[id] / otherSum * remainder; });
      else others.forEach(id => { next[id] = remainder / others.length; });
      return { ...prev, [raceId]: next };
    });
  };

  const result = useMemo(
    () => mapData?.counties ? project(mapData.counties, support) : null,
    [mapData, support]
  );

  const resetAll = () => { setSupport(SUPPORT_DEFAULT); };

  useEffect(() => {
    const leftCol = leftColRef.current, rightCol = rightColRef.current;
    if (!leftCol || !rightCol) return;
    const sync = () => {
      if (window.matchMedia('(max-width: 1200px)').matches) { rightCol.style.removeProperty('--sidebar-match-height'); return; }
      rightCol.style.setProperty('--sidebar-match-height', `${Math.round(leftCol.getBoundingClientRect().height)}px`);
    };
    const raf = () => requestAnimationFrame(sync);
    sync();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(raf) : null;
    ro?.observe(leftCol);
    window.addEventListener('resize', raf);
    return () => { ro?.disconnect(); window.removeEventListener('resize', raf); };
  }, [result]);

  const ranked = result?.ranked || [];
  const namedRanked = ranked.filter(r => r.id !== 'others');
  const qualifiers = namedRanked.slice(0, 2).map(r => r.id);
  const leader = namedRanked[0] ? CAND_BY_ID[namedRanked[0].id] : null;
  const runner = namedRanked[1] ? CAND_BY_ID[namedRanked[1].id] : null;
  const leadGap = ((namedRanked[0]?.pct ?? 0) - (namedRanked[1]?.pct ?? 0)).toFixed(1);

  const leaderCounts = {};
  if (result?.perCounty) for (const v of result.perCounty.values()) leaderCounts[v.leadId] = (leaderCounts[v.leadId] || 0) + 1;
  const legend = NAMED_IDS.map(id => ({ id, n: leaderCounts[id] || 0 })).filter(x => x.n > 0).sort((a, b) => b.n - a.n);

  return h("div", { className: "vh-root" },
    h("div", { className: "vh-wrap" },
      h("div", { className: "page-header" },
        h("h1", null, "Build Your Own California Gubernatorial Jungle Primary"),
        h("p", null, "California's top-two (jungle) gubernatorial primary, June 2, 2026. Set each demographic group's candidate support; the county map and statewide bars update live. The top two finishers advance to the November general election — regardless of margin.")),
      h("div", { className: "vh-grid" },

        /* ── LEFT COLUMN ── */
        h("div", { ref: leftColRef, className: "left-col" },
          h("div", { className: "results-banner" },
            h("div", { className: "candidate-summary" },
              h("div", { className: "cand-bars" },
                ranked.flatMap((r, i) => {
                  const row = h(CandRow, { key: r.id, cand: CAND_BY_ID[r.id], pct: r.pct, qualifies: qualifiers.includes(r.id) });
                  return i === 1 ? [row, h("div", { key: "cutoff", className: "cutoff-row" }, h("span", null, "top-two cutoff"))] : [row];
                })),
              h("div", { className: "margin-summary" },
                h("div", { className: "ms-head" }, "Advancing to November"),
                leader && h("div", { className: "ms-cand" },
                  h("img", { className: "ms-avatar", src: candPhoto(leader.id), alt: leader.name, onError: e => { e.target.style.visibility = 'hidden'; } }),
                  h("div", { className: `ms-name ${leader.cls}` }, leader.name),
                  h("div", { className: `ms-pct ${leader.cls}` }, `${(namedRanked[0]?.pct ?? 0).toFixed(1)}%`)),
                (leader && runner) && h("div", { className: "ms-rule" }, h("span", null, `+${leadGap} pt lead`)),
                runner && h("div", { className: "ms-cand" },
                  h("img", { className: "ms-avatar", src: candPhoto(runner.id), alt: runner.name, onError: e => { e.target.style.visibility = 'hidden'; } }),
                  h("div", { className: `ms-name ${runner.cls}` }, runner.name),
                  h("div", { className: `ms-pct ${runner.cls}` }, `${(namedRanked[1]?.pct ?? 0).toFixed(1)}%`))))),
          h("div", { className: "vh-card map-card" },
            h("div", { className: "map-caption" }, "Leading candidate by county"),
            h(CaliforniaMap, { geojson: mapData?.geojson, countyResults: result?.perCounty }),
            h("div", { className: "map-legend" },
              legend.map(x => h("div", { className: "legend-item", key: x.id },
                h("span", { className: "legend-swatch", style: { background: HEX[x.id] } }),
                h("span", { className: "legend-name" }, CAND_BY_ID[x.id].name.split(' ').slice(-1)[0]),
                h("span", { className: "legend-count" }, x.n)))))),

        /* ── RIGHT COLUMN — cards follow the strategy list ── */
        h("div", { ref: rightColRef, className: "right-col" },

          // Demographics — candidate support within each race/ethnicity group
          h(CollapsibleCard, { title: "Demographics", defaultOpen: true },
            h(SubSection, {
              title: "Support",
              sub: "Each candidate's share within a demographic group. Each group sums to 100%."
            },
              RACES.map(race => h("div", { key: race.id, className: "bracket-group" },
                h("div", { className: "bracket-group-head" }, race.label),
                NAMED.map(c => h(SliderRow, {
                  key: c.id, label: c.name,
                  value: support[race.id][c.id] * 100,
                  onChange: v => setSup(race.id, c.id, v),
                  max: 100, step: 0.5, suffix: '%', color: c.color
                })))))),

          h("button", { className: "reset-btn", onClick: resetAll }, "Reset All Levers")))));
}

try {
  ReactDOM.createRoot(document.getElementById('root')).render(h(CAGovernorForecast, null));
} catch (e) {
  console.error(e);
  document.getElementById('root').innerHTML = '<div class="error-pane">' + e.message + '\n\n' + (e.stack || '') + '</div>';
}

  </script>
</body>
